<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>2048</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0b0e14;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      touch-action: none;
    }
    .header {
      width: 340px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    h1 { font-size: 42px; font-weight: 800; color: #edc22e; }
    .controls { display: flex; gap: 10px; align-items: center; }
    .score-box {
      background: #181c26;
      border: 1px solid rgba(255,255,255,0.08);
      padding: 8px 16px;
      border-radius: 10px;
      text-align: center;
    }
    .score-label { font-size: 11px; text-transform: uppercase; color: #94a3b8; }
    .score-val { font-size: 20px; font-weight: 700; }
    button {
      background: #d84b6b;
      color: #fff;
      border: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    #board {
      width: 340px;
      height: 340px;
      background: #181c26;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 10px;
    }
    .tile {
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      background: rgba(255,255,255,0.04);
      color: #f8fafc;
    }
    .t-2 { background: #eee4da; color: #776e65; }
    .t-4 { background: #ede0c8; color: #776e65; }
    .t-8 { background: #f2b179; color: #f9f6f2; }
    .t-16 { background: #f59563; color: #f9f6f2; }
    .t-32 { background: #f67c5f; color: #f9f6f2; }
    .t-64 { background: #f65e3b; color: #f9f6f2; }
    .t-128 { background: #edcf72; color: #f9f6f2; font-size: 24px; }
    .t-256 { background: #edcc61; color: #f9f6f2; font-size: 24px; }
    .t-512 { background: #edc850; color: #f9f6f2; font-size: 24px; }
    .t-1024 { background: #edc53f; color: #f9f6f2; font-size: 20px; }
    .t-2048 { background: #edc22e; color: #f9f6f2; font-size: 20px; box-shadow: 0 0 18px rgba(237,194,46,0.5); }
    .t-big { background: #d84b6b; color: #fff; font-size: 18px; }
    .hint { margin-top: 14px; font-size: 13px; color: #64748b; }
  </style>
</head>
<body>
  <div class="header">
    <h1>2048</h1>
    <div class="controls">
      <div class="score-box">
        <div class="score-label">Score</div>
        <div class="score-val" id="score">0</div>
      </div>
      <button onclick="init()">New</button>
    </div>
  </div>
  <div id="board"></div>
  <div class="hint">Use Arrow Keys / WASD or Swipe</div>

  <script>
    let grid, score;
    const boardEl = document.getElementById('board');
    const scoreEl = document.getElementById('score');

    function init() {
      grid = Array.from({ length: 4 }, () => Array(4).fill(0));
      score = 0;
      addTile();
      addTile();
      render();
    }

    function addTile() {
      const empty = [];
      for (let r = 0; r < 4; r++)
        for (let c = 0; c < 4; c++)
          if (grid[r][c] === 0) empty.push([r, c]);
      if (!empty.length) return;
      const [r, c] = empty[Math.floor(Math.random() * empty.length)];
      grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    }

    function render() {
      boardEl.innerHTML = '';
      scoreEl.textContent = score;
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          const val = grid[r][c];
          const div = document.createElement('div');
          div.className = 'tile' + (val ? (val <= 2048 ? ' t-' + val : ' t-big') : '');
          div.textContent = val || '';
          boardEl.appendChild(div);
        }
      }
    }

    function slide(row) {
      let arr = row.filter(v => v);
      for (let i = 0; i < arr.length - 1; i++) {
        if (arr[i] === arr[i + 1]) {
          arr[i] *= 2;
          score += arr[i];
          arr[i + 1] = 0;
        }
      }
      arr = arr.filter(v => v);
      while (arr.length < 4) arr.push(0);
      return arr;
    }

    function move(dir) {
      const prev = JSON.stringify(grid);
      if (dir === 'left' || dir === 'right') {
        for (let r = 0; r < 4; r++) {
          let row = grid[r].slice();
          if (dir === 'right') row.reverse();
          row = slide(row);
          if (dir === 'right') row.reverse();
          grid[r] = row;
        }
      } else {
        for (let c = 0; c < 4; c++) {
          let col = [grid[0][c], grid[1][c], grid[2][c], grid[3][c]];
          if (dir === 'down') col.reverse();
          col = slide(col);
          if (dir === 'down') col.reverse();
          for (let r = 0; r < 4; r++) grid[r][c] = col[r];
        }
      }
      if (JSON.stringify(grid) !== prev) {
        addTile();
        render();
      }
    }

    window.addEventListener('keydown', e => {
      const map = { ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right', ArrowUp: 'up', w: 'up', ArrowDown: 'down', s: 'down' };
      if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
    });

    let sx, sy;
    window.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; });
    window.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - sx;
      const dy = e.changedTouches[0].clientY - sy;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 25) return;
      if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
      else move(dy > 0 ? 'down' : 'up');
    });

    init();
  </script>
</body>
</html>
