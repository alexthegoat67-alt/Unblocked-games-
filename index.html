<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online Games</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #a1a8b5;
      background-color: #0b0e14;
      background-image:
        radial-gradient(circle at 18% 85%, rgba(16, 48, 66, 0.75) 0%, transparent 50%),
        radial-gradient(circle at 88% 18%, rgba(56, 22, 48, 0.65) 0%, transparent 50%),
        linear-gradient(135deg, #0b0e14 0%, #121622 50%, #1b1523 100%);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
      padding: 24px;
    }

    .game-card {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 180px;
      height: 180px;
      background-color: rgba(24, 28, 38, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.18s ease, border-color 0.18s ease, background-color 0.18s ease;
    }

    .game-card:hover {
      transform: translateY(-4px);
      background-color: rgba(34, 39, 53, 0.95);
      border-color: rgba(216, 75, 107, 0.55);
    }

    .game-card:active {
      transform: scale(0.98);
    }

    /* Built-in 2048 Tile Graphic */
    .icon-2048 {
      width: 112px;
      height: 112px;
      border-radius: 16px;
      background: linear-gradient(135deg, #f3d250 0%, #edc22e 100%);
      color: #ffffff;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 6px 18px rgba(237, 194, 46, 0.35);
    }
  </style>
</head>
<body>

  <main class="grid">
    <!-- Square 1: 2048 -->
    <div class="game-card" onclick="launchGame('games/1.html')" role="button" tabindex="0" aria-label="Play 2048">
      <div class="icon-2048">2048</div>
    </div>

    <!-- Square 2 -->
    <div class="game-card" onclick="launchGame('games/2.html')" role="button" tabindex="0" aria-label="Game 2"></div>

    <!-- Square 3 -->
    <div class="game-card" onclick="launchGame('games/3.html')" role="button" tabindex="0" aria-label="Game 3"></div>

    <!-- Square 4 -->
    <div class="game-card" onclick="launchGame('games/4.html')" role="button" tabindex="0" aria-label="Game 4"></div>
  </main>

  <script>
    async function launchGame(gameUrl) {
      const win = window.open('about:blank', '_blank');
      if (!win) return;

      try {
        const response = await fetch(gameUrl);
        if (!response.ok) throw new Error('Game file not found');
        const htmlCode = await response.text();

        win.document.open();
        win.document.write(htmlCode);
        win.document.close();
      } catch (err) {
        win.close();
        alert('Could not load ' + gameUrl + '. Make sure the file exists!');
      }
    }
  </script>

</body>
</html>
